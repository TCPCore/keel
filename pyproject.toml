[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
version = "0.1.0"
description = "Checkpoint-level misalignment drift detection and neuron attribution for open-weight models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Cereb contributors" }]
keywords = ["ai-safety", "interpretability", "mechanistic-interpretability", "llm", "alignment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = [
  "torch>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "peft>=0.12",
  "datasets>=2.20",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/keel"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"space/app.py" = ["E501"]
"scripts/export_static.py" = ["E501"]
