name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Demo runs without a GPU or an API key
        run: |
          python -m keel.cli demo --out /tmp/card
          test -f /tmp/card/drift-card.md
          test -f /tmp/card/drift-card.json
      - name: Lint
        # TODO(day 2): flip to blocking once the tree is clean.
        continue-on-error: true
        run: python -m ruff check src tests
